name: Build and Release ProxyCord

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (leave blank for auto v1.0.X)'
        required: false
        default: ''
      is_prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/ProxyCord/ProxyCord.csproj

      - name: Run unit tests
        run: dotnet test src/ProxyCord.Tests/ProxyCord.Tests.csproj -c Release --verbosity normal

      - name: Publish single-file executable
        run: |
          dotnet publish src/ProxyCord/ProxyCord.csproj -c Release -r win-x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --self-contained false -o dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxyCord-win-x64
          path: dist/ProxyCord.exe
          if-no-files-found: error

      - name: Determine Release Tag
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))) || github.event_name == 'workflow_dispatch'
        id: tag
        shell: pwsh
        run: |
          $ref = '${{ github.ref }}'
          $inputTag = '${{ github.event.inputs.tag_name }}'.Trim()
          if ($ref.StartsWith('refs/tags/v')) {
            $tag = '${{ github.ref_name }}'
          } elseif ($inputTag -ne '') {
            $tag = $inputTag
          } else {
            $tag = "v1.0.${{ github.run_number }}"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "title=ProxyCord $tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create GitHub Release
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))) || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.title }}
          files: dist/ProxyCord.exe
          generate_release_notes: true
          prerelease: ${{ github.event.inputs.is_prerelease == 'true' }}
