name: Build and Release ProxyCord

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/ProxyCord/ProxyCord.csproj

      - name: Run unit tests
        run: dotnet test src/ProxyCord.Tests/ProxyCord.Tests.csproj -c Release --verbosity normal

      - name: Publish single-file executable
        run: |
          dotnet publish src/ProxyCord/ProxyCord.csproj -c Release -r win-x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --self-contained false -o dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxyCord-win-x64
          path: dist/ProxyCord.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ProxyCord.exe
          generate_release_notes: true
